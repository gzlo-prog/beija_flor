<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta - Beija Flor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor">
      <div class="logo">
        <img src="img/logo.jpg" alt="Beija Flor" class="logo-img">
        <div>
          <b>Beija Flor</b>
          <small>Variedades</small>
        </div>
      </div>
      <nav class="menu" id="menu">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="contacto.html">Contacto</a>
        <a href="mi-cuenta.html" class="activo" id="linkCuenta">Mi cuenta</a>

  <main class="seccion">
    <div class="contenedor">
      <h1 class="titulo">Mi cuenta</h1>

      <div class="caja-login" style="max-width:500px;text-align:left;">
        <p><b>Nombre:</b> <span id="cuentaNombre">-</span></p>
        <p><b>Correo:</b> <span id="cuentaEmail">-</span></p>
        <p><b>Teléfono:</b> <span id="cuentaTel">-</span></p>

        <h3 style="margin:20px 0 10px;color:#2a9d8f;">Mis pedidos</h3>
        <div id="misPedidos"></div>

        <button class="boton boton-gris" id="btnCerrarSesion" style="margin-top:20px;">Cerrar sesión</button>
      </div>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <p><b>🐦 Beija Flor Variedades</b> — Fontana 353</p>
      <p class="copy">© 2026 Beija Flor Variedades</p>
    </div>

  <script src="js/productos.js"></script>
  <script src="js/script.js"></script>

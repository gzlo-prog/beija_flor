<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Beija Flor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor">
      <div class="logo">
        <img src="img/logo.jpg" alt="Beija Flor" class="logo-img">
        <div>
          <b>Beija Flor</b>
          <small>Variedades</small>
        </div>
      </div>
      <nav class="menu" id="menu">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html" class="activo" id="linkCuenta">Mi cuenta</a>
      </nav>
      <button class="btn-menu" id="btnMenu">☰</button>
    </div>
  </header>

  <main class="seccion">
    <div class="contenedor">
      <div class="caja-login">
        <h1>Iniciar sesión</h1>
        <p class="texto-ayuda">Entrá con tu correo y contraseña</p>

        <form id="formLogin">
          <div class="form-grupo">
            <label>Correo electrónico</label>
            <input type="email" id="loginEmail" required placeholder="tu@email.com">
          </div>
          <div class="form-grupo">
            <label>Contraseña</label>
            <input type="password" id="loginClave" required placeholder="Tu contraseña">
          </div>
          <button type="submit" class="boton">Entrar</button>
        </form>

        <p id="errorLogin" class="error" style="display:none;">Correo o contraseña incorrectos</p>

        <p class="texto-ayuda" style="margin-top:15px;">
          ¿No tenés cuenta? <a href="registro.html" style="color:#2a9d8f;font-weight:bold;">Registrate</a>
        </p>

        <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">

        <p class="texto-ayuda">¿Sos el dueño del local?</p>
        <a href="admin-login.html" class="boton boton-borde" style="margin-top:5px;">Entrar como administrador</a>
      </div>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <p><b>🐦 Beija Flor Variedades</b> — Fontana 353</p>
      <p class="copy">© 2026 Beija Flor Variedades</p>
    </div>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
